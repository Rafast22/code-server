name: Build code-server para Alpine (musl) e publicar .apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine   # Node 24 + musl

    steps:
      - name: Instalar dependências de build
        run: |
          apk add --no-cache \
            git git-lfs python3 make g++ tar curl bash \
            alpine-sdk sudo shadow \
            libstdc++ libc6-compat krb5-dev \
            quilt rsync unzip jq

      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive   # importante para o vscode

      - name: Aplicar patches do VS Code
        run: |
          quilt push -a

      - name: Instalar dependências do projeto
        run: |
          npm ci

      - name: Build do code-server
        run: |
          npm run build
          VERSION=$(node -p "require('./package.json').version")
          VERSION=$VERSION npm run build:vscode
          KEEP_MODULES=1 npm run release

      - name: Empacotar release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p alpine
          cp -r release alpine/release

      - name: Preparar chaves do abuild
        run: |
          adduser -D builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.abuild
          echo "${{ secrets.ABUILD_PRIVKEY }}" | base64 -d > /home/builder/.abuild/builder.rsa
          echo "${{ secrets.ABUILD_PUBKEY }}"  | base64 -d > /home/builder/.abuild/builder.rsa.pub
          echo "PACKAGER_PRIVKEY=/home/builder/.abuild/builder.rsa" > /home/builder/.abuild/abuild.conf
          cp /home/builder/.abuild/builder.rsa.pub /etc/apk/keys/
          chown -R builder:builder /home/builder/.abuild alpine

      - name: Gerar APKBUILD com a versão atual
        run: |
          sed "s/__VERSION__/${VERSION}/" alpine/APKBUILD.template > alpine/APKBUILD || \
          cp alpine/APKBUILD.template alpine/APKBUILD

      - name: Rodar abuild
        run: |
          su builder -c "cd $(pwd)/alpine && abuild -r"

      - name: Localizar .apk gerado
        run: |
          find /home/builder/packages -name "*.apk" -exec cp {} . \;
          ls -la *.apk

      - name: Publicar como GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          tag_name: ${{ github.ref_name }}
